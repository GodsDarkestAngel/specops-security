<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rotated square (diamond) body -->
  <rect x="24" y="24" width="52" height="52" stroke="#8A9B4E" stroke-width="4" fill="none"
        transform="rotate(45 50 50)"/>
  <!-- Cardinal reticle ticks -->
  <line x1="50" y1="4"  x2="50" y2="18" stroke="#8A9B4E" stroke-width="4"/>
  <line x1="50" y1="82" x2="50" y2="96" stroke="#8A9B4E" stroke-width="4"/>
  <line x1="4"  y1="50" x2="18" y2="50" stroke="#8A9B4E" stroke-width="4"/>
  <line x1="82" y1="50" x2="96" y2="50" stroke="#8A9B4E" stroke-width="4"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="5" fill="#8A9B4E"/>
</svg>
